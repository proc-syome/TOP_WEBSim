<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>絶オメガ P2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Chakra+Petch:wght@500;700&display=swap">
<style>
:root{--bg:#0f1218;--panel:#181d26;--line:#2b3340;--fg:#e7eaf0;--mute:#8b94a5;--accent:#5fd3c4;
  --display:"Chakra Petch","Zen Kaku Gothic New",system-ui,sans-serif;--body:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;color-scheme:dark}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-size:1.35rem;margin:0;letter-spacing:.04em}
h1 small{display:block;font-family:var(--body);font-size:.8rem;color:var(--mute);font-weight:400;letter-spacing:0}
a.card{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:none}
a.card b{font-family:var(--display);font-size:1.05rem}
a.card span{font-size:.85rem;color:var(--mute)}
.soon{padding:14px 16px;border:1px dashed var(--line);border-radius:10px;color:var(--mute);font-size:.88rem}
.site-foot{margin-top:8px;padding-top:12px;border-top:1px solid var(--line);font-size:.75rem;line-height:1.7;color:var(--mute);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>絶オメガ P2<small>連携プログラム</small></h1>
  <a class="card" href="combo/"><b>連携プログラム_コンボ</b></a>
  <a class="card" href="playstation/"><b>連携プログラム_プレステ</b></a>
  <footer class="site-foot">© SQUARE ENIX<br>本サイトは FINAL FANTASY XIV のファンサイト（非公式）です。</footer>
</div>
</body>
</html>
