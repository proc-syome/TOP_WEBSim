<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>検知式波動砲</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: 1カラム。上に設定、中央に図、下に操作ボタン */
:root{
  --bg:#0f1218; --panel:#181d26; --line:#2b3340; --fg:#e7eaf0; --mute:#8b94a5;
  --accent:#5fd3c4; --hit:#ff4d5e; --ok:#57d98a;
  --mkA:#ff5a5a; --mkB:#ffd23f; --mkC:#4ea8ff; --mkD:#c07bff;
  --omF:#e8434f; --omM:#3c7dff;
  --mon:#6ec6ff;                 /* 検知の色（水色） */
  --display:"Chakra Petch","Zen Kaku Gothic New",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-size:1.35rem;margin:0;letter-spacing:.04em;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-size:.8rem;color:var(--mute);font-weight:400;letter-spacing:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.label{font-family:var(--display);font-size:.72rem;letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.pt-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hint{font-size:.78rem;color:var(--mute);margin-top:-6px}
.pt{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(56px,22vw,120px)}
.tethers{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ptcol{position:relative;display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;justify-content:space-between;gap:6px;font:700 .95rem var(--display);padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
#colR .slot{flex-direction:row-reverse}
.slot svg{flex:none;display:block}
.slot[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.slot:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.party{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;font-size:.88rem}
.pm{display:flex;justify-content:space-between;gap:8px;padding:3px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.pm.me{background:rgba(95,211,196,.15);outline:1px solid var(--accent)}
.pm b{font-family:var(--display)}
.sym{font-weight:700;min-width:1.4em;text-align:center}
.debuff{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font:700 .85rem var(--display);padding:3px 10px;border-radius:99px;border:1px solid currentColor}
.chip.mid{color:#ffb547}.chip.far{color:#7fc8ff}
.field{width:min(760px,calc(100vw - 12px));max-width:none;align-self:center;aspect-ratio:1;display:block;touch-action:manipulation;cursor:crosshair}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;font:700 .95rem var(--body);padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0f1218}
.btn:disabled{opacity:.4;cursor:default}
.result{font-weight:700;padding:10px 12px;border-radius:8px;border:1px solid var(--line)}
.result.ok{color:var(--ok);border-color:var(--ok)}
.result.ng{color:var(--hit);border-color:var(--hit)}
.result ul{margin:4px 0 0;padding-left:1.2em;font-weight:400;color:var(--fg);font-size:.88rem}
.opt{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.opt input{width:18px;height:18px;accent-color:var(--accent)}
.ta-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qn{display:flex;align-items:center;gap:6px}
.qn input{width:4.5em;font:700 1rem var(--display);padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-variant-numeric:tabular-nums}
.btn.small{flex:none;min-width:0;padding:7px 14px;font-size:.88rem}
.ta-final{padding:8px 10px;border-radius:8px;border:1px solid var(--accent);color:var(--fg);font-size:.92rem}
.ta-final b{color:var(--accent);font-family:var(--display)}
.ta-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;text-align:center}
.ta-bar small{display:block;font-size:.7rem;color:var(--mute);letter-spacing:.1em}
.ta-bar b{font:700 1.25rem var(--display);font-variant-numeric:tabular-nums}
.legend{font-size:.82rem;color:var(--mute);display:flex;flex-direction:column;gap:2px}
.legend b{color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.aoe{animation:fade .35s ease-out}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.site-foot{margin-top:8px;padding-top:12px;border-top:1px solid var(--line);font-size:.75rem;line-height:1.7;color:var(--mute);text-align:center}
.slot{justify-content:flex-end;padding:2px 10px}
#pt-panel{gap:6px;padding-block:8px}
#pt-panel .ptcol{gap:4px}
#pt-panel .sub{letter-spacing:0;text-transform:none}
#pt-panel .label{white-space:nowrap}
#pt-panel .pt-head{flex-wrap:nowrap}
[hidden]{display:none!important}
.slot.moved{border-style:dashed}
.ptlist{display:flex;flex-direction:column;gap:3px;margin:0;padding:0;list-style:none}
.pr{display:grid;grid-template-columns:1.8em 26px 1fr auto auto;align-items:center;gap:8px;padding:2px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:.88rem}
.pr[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pr:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pr .no{font:700 .78rem var(--display);color:var(--mute);text-align:center;font-variant-numeric:tabular-nums}
.pr img{width:26px;height:26px;display:block}
.pr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pr .me{font-size:.7rem;color:var(--accent);margin-left:4px}
.tag{font:700 .72rem var(--display);padding:1px 8px;border-radius:99px;white-space:nowrap}
.tag.mon{color:var(--mon);border:1px solid var(--mon)}
.tag.none{color:var(--mute);border:1px solid transparent}
.mv{display:flex;gap:2px}
.mv button{font:700 .7rem var(--display);width:24px;height:22px;padding:0;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--mute);cursor:pointer}
.mv button:disabled{opacity:.25;cursor:default}
#pt-panel{gap:6px;padding-block:8px}
#pt-panel .sub{letter-spacing:0;text-transform:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>検知式波動砲</h1>

  <section class="panel" aria-labelledby="lbl-opt">
    <div class="label" id="lbl-opt">オプション</div>
    <label class="opt"><input type="checkbox" id="instant" checked> 位置を選んだ時点で結果を表示</label>
    <div class="ta-row">
      <label class="opt" for="qcount">タイムアタック</label>
      <span class="qn"><input type="number" id="qcount" min="1" max="200" value="30" inputmode="numeric"> 問</span>
      <button class="btn small primary" id="ta-start" type="button">スタート</button>
      <button class="btn small" id="ta-stop" type="button" hidden>中止</button>
    </div>
    <div id="ta-final" class="ta-final" hidden></div>
  </section>

  <div id="ta-bar" class="ta-bar" hidden>
    <span><small>問題</small><b id="ta-count">1 / 30</b></span>
    <span><small>正解</small><b id="ta-ok">0</b></span>
    <span><small>秒</small><b id="ta-time">0.0</b></span>
  </div>

  <section class="panel" id="pt-panel" aria-labelledby="lbl-pt">
    <div class="label" id="lbl-pt">PT<span class="sub">（並び順は表示用・優先順はTDH／自分をタップ）</span></div>
    <ol class="ptlist" id="ptlist"></ol>
  </section>

  <svg id="field" class="field" viewBox="-104 -104 208 208" role="img" aria-label="円形フィールド。タップで移動先を選ぶ"></svg>

  <div class="row">
    <button class="btn primary" id="check" type="button">答え合わせ</button>
    <button class="btn" id="next" type="button">次の問題</button>
  </div>
  <div id="result" class="result" hidden></div>

  <footer class="site-foot">© SQUARE ENIX<br>本サイトは FINAL FANTASY XIV のファンサイト（非公式）です。</footer>
</div>

<script>
const IMG='../../img/jobs/';
const R=100, RM=72;
const CR=200/2.7/2;              // 全員に着弾する円範囲の半径（直径はフィールドの1/2.7）。ほかの人が入ると失敗
const JOBS={drk:{n:'暗黒騎士',s:'暗'},pld:{n:'ナイト',s:'ナ'},rpr:{n:'リーパー',s:'リ'},drg:{n:'竜騎士',s:'竜'},
  brd:{n:'吟遊詩人',s:'詩'},blm:{n:'黒魔道士',s:'黒'},sge:{n:'賢者',s:'賢'},sch:{n:'学者',s:'学'}};
const DEF=['drk','pld','rpr','drg','brd','blm','sge','sch'];   // 優先順位（TDH固定）：MT ST D1 D2 D3 D4 H1 H2
const PRI={drk:'MT',pld:'ST',rpr:'D1',drg:'D2',brd:'D3',blm:'D4',sge:'H1',sch:'H2'};
const MK=[
  {n:'A',a:0,  c:'--mkA',sq:false},{n:'1',a:45, c:'--mkA',sq:true},
  {n:'B',a:90, c:'--mkB',sq:false},{n:'2',a:135,c:'--mkB',sq:true},
  {n:'C',a:180,c:'--mkC',sq:false},{n:'3',a:225,c:'--mkC',sq:true},
  {n:'D',a:270,c:'--mkD',sq:false},{n:'4',a:315,c:'--mkD',sq:true}];
// アスト式（ボス検知が東のとき）。西のときは左右反転
const rad=d=>d*Math.PI/180;
const pos=(a,r)=>[r*Math.sin(rad(a)),-r*Math.cos(rad(a))];
// ❶：マーカー4（反転時は1）の中央側の側面のx。❷：4とDの間（1とB）。❸：3とDの間（2とB）
const MK4=pos(315,RM), MKD=pos(270,RM), MK3=pos(225,RM);
// ❷❸はマーカーの間から外周側へ2歩（フィールド半径20yを100とすると1y=5）
const OUT=(p,d)=>{const l=Math.hypot(p[0],p[1]);return [p[0]*(l+d)/l,p[1]*(l+d)/l]};
const SPOT={M1:[MK4[0]+7,-70],M2:OUT([(MK4[0]+MKD[0])/2,(MK4[1]+MKD[1])/2],10),M3:OUT([(MK3[0]+MKD[0])/2,(MK3[1]+MKD[1])/2],10),
  N1:[-6,-92],N2:[32,0],N3:[90,0],N4:[-10,46],N5:[-10,92]};
// 検知役の撃つ方向（東のとき）。❶は外側、❷は北、❸は南
const BEAM={M1:[-1,0],M2:[0,-1],M3:[0,1]};
const LABEL={M1:'①',M2:'②',M3:'③',N1:'①',N2:'②',N3:'③',N4:'④',N5:'⑤'};
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const $=id=>document.getElementById(id);

let order=DEF.slice(), me='blm', S=null, pick=null, revealed=false;
try{
  const o=JSON.parse(localStorage.getItem('top_p3wc_order')||'null');
  if(Array.isArray(o)&&o.length===8&&DEF.every(j=>o.includes(j))) order=o;
  const m=localStorage.getItem('top_p3wc_me'); if(DEF.includes(m)) me=m;
}catch(e){}
const save=()=>{try{localStorage.setItem('top_p3wc_order',JSON.stringify(order));localStorage.setItem('top_p3wc_me',me)}catch(e){}};

// 役割：検知持ちは優先順（TDH）に❶❷❸、無職は①〜⑤。PTリストの並び順は表示だけ
function roles(){
  const r={}; let m=0,n=0;
  DEF.forEach(j=>{r[j]=S.mon.has(j)?'M'+(++m):'N'+(++n)});
  return r;
}
const flip=()=>S.side==='E'?1:-1;
const spot=role=>[SPOT[role][0]*flip(),SPOT[role][1]];
const beam=role=>[BEAM[role][0]*flip(),BEAM[role][1]];
// 実際の位置：自分は選んだ位置、ほかの人はアスト式の位置
const at=(j,r)=>(j===me&&pick)?pick:spot(r[j]);

// 処理が成立するか：ボス検知＋検知3本で全員ちょうど1回、各検知は2人、自分の円にほかの人が入らない
function simulate(){
  const r=roles(), P={}, hits={};
  DEF.forEach(j=>{P[j]=at(j,r);hits[j]=0});
  DEF.forEach(j=>{if(P[j][0]*flip()>0)hits[j]++});
  let beamsOk=true;
  DEF.filter(j=>S.mon.has(j)).forEach(h=>{
    const o=P[h], d=beam(r[h]); let c=0;
    DEF.forEach(j=>{if(j===h)return;if((P[j][0]-o[0])*d[0]+(P[j][1]-o[1])*d[1]>0){hits[j]++;c++}});
    if(c!==2) beamsOk=false;
  });
  const m=P[me];
  const inside=Math.hypot(m[0],m[1])<=R;
  const overlap=DEF.some(j=>j!==me&&Math.hypot(P[j][0]-m[0],P[j][1]-m[1])<CR);
  return {ok:inside&&beamsOk&&!overlap&&DEF.every(j=>hits[j]===1),P,r};
}

function newRound(){
  S={side:Math.random()<.5?'E':'W',mon:new Set(shuffle(DEF.slice()).slice(0,3))};
  pick=null; revealed=false; qShownAt=performance.now();
  $('result').hidden=true;
  renderList(); draw();
}

function renderList(){
  const r=S?roles():{};
  $('ptlist').innerHTML=order.map((j,i)=>{
    const mon=S&&S.mon.has(j);
    const tag=mon?`<span class="tag mon">検知${revealed?' '+LABEL[r[j]]:''}</span>`:`<span class="tag none">${revealed?LABEL[r[j]]:''}</span>`;
    return `<li class="pr" role="button" tabindex="0" aria-pressed="${j===me}" data-j="${j}">
      <span class="no">${PRI[j]}</span><img src="${IMG}${j}.png" alt="" width="26" height="26">
      <span class="nm">${JOBS[j].n}${j===me?'<span class="me">自分</span>':''}</span>${tag}
      <span class="mv"><button type="button" data-up="${i}" aria-label="上へ" ${i===0||TA?'disabled':''}>▲</button><button type="button" data-dn="${i}" aria-label="下へ" ${i===7||TA?'disabled':''}>▼</button></span></li>`;
  }).join('');
}

function judge(){return simulate()}

// 半面（originを通り、dir方向）をフィールド円で切り取った形
function half(o,d,fill){
  const big=400, [dx,dy]=d, [px,py]=[-dy,dx];
  const a=[o[0]+px*big,o[1]+py*big], b=[o[0]-px*big,o[1]-py*big];
  const c=[b[0]+dx*big,b[1]+dy*big], e=[a[0]+dx*big,a[1]+dy*big];
  return `<polygon points="${[a,b,c,e].map(q=>q.join(',')).join(' ')}" fill="${fill}"/>`;
}

// ボスの検知の向き：中心角120度のバームクーヘン形（中心角cの方向、内半径r1・外半径r2）
function arcBand(c,w,r1,r2){
  const a0=c-w/2, a1=c+w/2, [x0,y0]=pos(a0,r2), [x1,y1]=pos(a1,r2), [x2,y2]=pos(a1,r1), [x3,y3]=pos(a0,r1);
  return `<path d="M${x0},${y0} A${r2},${r2} 0 0,1 ${x1},${y1} L${x2},${y2} A${r1},${r1} 0 0,0 ${x3},${y3} Z" fill="rgba(60,125,255,.75)" stroke="#9cc0ff" stroke-width=".6"/>`;
}
// 番号マーク：検知は水色、無職は白。どちらも同じ形
function badge(x,y,role){
  const mon=role[0]==='M';
  return `<g><circle cx="${x}" cy="${y}" r="3.6" fill="${mon?css('--mon'):'#e7eaf0'}" stroke="#0f1218" stroke-width=".8"/>
    <text x="${x}" y="${y+1.9}" font-size="5.2" font-weight="700" text-anchor="middle" fill="#0f1218" font-family="Chakra Petch">${role[1]}</text></g>`;
}
function draw(){
  const m=flip();
  let s=`<defs><clipPath id="clip"><circle r="${R}"/></clipPath></defs>
  <circle r="${R}" fill="#1c2330" stroke="#3a4555" stroke-width="2"/>
  <circle r="${RM}" fill="none" stroke="#2b3340" stroke-dasharray="1 3"/>
  <line x1="${-R}" y1="0" x2="${R}" y2="0" stroke="#2b3340" stroke-width=".5"/>
  <line x1="0" y1="${-R}" x2="0" y2="${R}" stroke="#2b3340" stroke-width=".5"/>`;
  // ボス検知側のモニター（外周の弧）
  s+=`<path d="M0,${-R+3} A${R-3},${R-3} 0 0,${m>0?1:0} 0,${R-3}" fill="none" stroke="${css('--mon')}" stroke-width="3" stroke-dasharray="6 4" opacity=".8"/>`;
  if(revealed){
    const r=roles(), g=`<g class="aoe" clip-path="url(#clip)">`;
    s+=g+half([0,0],[m,0],'rgba(255,77,94,.30)');
    const cols={M1:'rgba(110,198,255,.20)',M2:'rgba(110,198,255,.20)',M3:'rgba(110,198,255,.20)'};
    DEF.filter(j=>S.mon.has(j)).forEach(j=>{s+=half(at(j,r),beam(r[j]),cols[r[j]])});
    s+='</g>';
  }
  MK.forEach(mk=>{
    const [x,y]=pos(mk.a,RM), c=css(mk.c);
    s+=mk.sq?`<rect x="${x-7}" y="${y-7}" width="14" height="14" fill="rgba(0,0,0,.35)" stroke="${c}" stroke-width="1.8"/>`
           :`<circle cx="${x}" cy="${y}" r="7.5" fill="rgba(0,0,0,.35)" stroke="${c}" stroke-width="1.8"/>`;
    s+=`<text x="${x}" y="${y+3.2}" font-size="9" font-weight="700" text-anchor="middle" fill="${c}" font-family="Chakra Petch">${mk.n}</text>`;
  });
  // オメガ（北向き）
  s+=`<polygon points="0,-9 7,6 -7,6" fill="#6b7280" stroke="#fff" stroke-width=".8" stroke-linejoin="round"/>
      ${arcBand(m>0?90:270,120,11,21)}`;
  if(revealed){
    const r=roles();
    // 自分のアスト式の位置（目安）
    { const [x,y]=spot(r[me]); s+=`<circle cx="${x}" cy="${y}" r="5" fill="none" stroke="${css('--accent')}" stroke-width="1" stroke-dasharray="2 1.5"/>`; }
    // 全員の円範囲
    s+=`<g clip-path="url(#clip)">`+DEF.map(j=>{const [x,y]=at(j,r); return `<circle cx="${x}" cy="${y}" r="${CR}" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.28)" stroke-width=".5"/>`}).join('')+`</g>`;
    DEF.forEach(j=>{
      if(j===me&&pick) return;
      const [x,y]=at(j,r);
      s+=`<image href="${IMG}${j}.png" x="${x-6}" y="${y-6}" width="12" height="12"/>
        ${badge(x+6.5,y+6.5,r[j])}`;
    });
  }
  if(pick){
    const [x,y]=pick, col=revealed?(judge().ok?css('--ok'):css('--hit')):css('--accent');
    s+=`<circle cx="${x}" cy="${y}" r="4.5" fill="${col}" stroke="#0f1218" stroke-width="1.2"/>
      <text x="${x+6}" y="${y-4}" font-size="5.5" font-weight="700" fill="${col}" font-family="Chakra Petch">自分</text>`;
  }
  $('field').innerHTML=s;
}

const FEEDBACK_MS=900;
let TA=null, qShownAt=0;
function reveal(){
  revealed=true; renderList(); draw();
  const r=$('result'); r.hidden=false;
  if(!pick){r.className='result';r.textContent='未選択';return {ok:false}}
  const j=judge();
  r.className='result '+(j.ok?'ok':'ng');
  r.textContent=j.ok?'正解':'不正解';
  return j;
}
function syncUI(){
  const inst=$('instant').checked;
  $('check').hidden=!!TA||inst;
  $('next').hidden=!!TA;
  $('ta-start').hidden=!!TA; $('ta-stop').hidden=!TA;
  $('instant').disabled=!!TA; $('qcount').disabled=!!TA;
  $('ta-bar').hidden=!TA;
  renderList();
}
function taTick(){
  if(!TA) return;
  const t=TA.done?TA.elapsed:(performance.now()-TA.start)/1000;
  $('ta-time').textContent=t.toFixed(1);
  $('ta-count').textContent=`${Math.min(TA.i+1,TA.n)} / ${TA.n}`;
  $('ta-ok').textContent=TA.ok;
  if(!TA.done) requestAnimationFrame(taTick);
}
function taStart(){
  const n=Math.max(1,Math.min(200,parseInt($('qcount').value,10)||30));
  $('qcount').value=n;
  TA={n,i:0,ok:0,start:performance.now(),busy:false,done:false};
  $('ta-final').hidden=true;
  newRound(); syncUI(); taTick();
}
function taStop(){TA=null; syncUI(); newRound()}
function taFinish(){
  TA.done=true; TA.elapsed=(performance.now()-TA.start)/1000; taTick();
  const f=$('ta-final'); f.hidden=false;
  f.innerHTML=`<b>${TA.n}問 完了</b>　タイム <b>${TA.elapsed.toFixed(1)}秒</b>　正解 <b>${TA.ok}/${TA.n}</b>（${Math.round(TA.ok/TA.n*100)}%）`;
  TA=null; syncUI();
}

$('field').addEventListener('click',e=>{
  if(revealed||(TA&&TA.busy)) return;
  const svg=e.currentTarget, pt=svg.createSVGPoint();
  pt.x=e.clientX; pt.y=e.clientY;
  const q=pt.matrixTransform(svg.getScreenCTM().inverse());
  pick=[q.x,q.y];
  if(TA){
    TA.busy=true;
    if(reveal().ok) TA.ok++;
    setTimeout(()=>{
      if(!TA) return;
      TA.i++;
      if(TA.i>=TA.n) return taFinish();
      TA.busy=false; newRound();
    },FEEDBACK_MS);
    return;
  }
  if($('instant').checked) reveal(); else draw();
});
$('ptlist').addEventListener('click',e=>{
  if(TA) return;
  const up=e.target.closest('[data-up]'), dn=e.target.closest('[data-dn]');
  if(up||dn){
    const i=+(up?up.dataset.up:dn.dataset.dn), k=up?i-1:i+1;
    if(k<0||k>7) return;
    [order[i],order[k]]=[order[k],order[i]];
  }else{
    const li=e.target.closest('.pr'); if(!li) return;
    me=li.dataset.j;
  }
  save(); renderList(); draw();
});
$('ptlist').addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('pr')){e.preventDefault();e.target.click()}
});
$('check').addEventListener('click',reveal);
$('next').addEventListener('click',newRound);
$('instant').addEventListener('change',()=>{
  try{localStorage.setItem('top_p3wc_instant',$('instant').checked?'1':'0')}catch(e){}
  syncUI();
});
$('qcount').addEventListener('change',()=>{try{localStorage.setItem('top_p3wc_qcount',$('qcount').value)}catch(e){}});
$('ta-start').addEventListener('click',taStart);
$('ta-stop').addEventListener('click',taStop);
try{
  const v=localStorage.getItem('top_p3wc_instant'); if(v!==null) $('instant').checked=v==='1';
  const q=localStorage.getItem('top_p3wc_qcount'); if(q) $('qcount').value=q;
}catch(e){}
newRound(); syncUI();
</script>
</body>
</html>
